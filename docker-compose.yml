version: '3.9'

# Servicios locales de infraestructura.
# La base de datos vive en SQL Azure — no se incluye aquí.

services:
  redis:
    image: redis:7-alpine
    container_name: inventario_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inventario_rabbitmq
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # Management UI  →  http://localhost:15672  (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
