version: '3.9'

# Para desarrollo local: levanta Redis + RabbitMQ
# Para producción (Easypanel): usa los servicios backend y frontend
# La base de datos vive en SQL Azure — no se incluye aquí.

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: inventario_backend
    ports:
      - '3000:3000'
    env_file:
      - ./apps/backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: inventario_frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inventario_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inventario_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
